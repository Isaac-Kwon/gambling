name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm ci fails on Linux: lockfile written on Windows omits rolldown's wasm optional deps (@emnapi/*) — npm bug
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run gen:demo -- --check
      - run: npm run rtp
      - run: npm run build
        env:
          BASE_PATH: /gambling/
      - run: npm run check:bundle
      - run: npx tsx scripts/i18n-sync.ts --check
      - run: rm -rf dist/.vite   # build manifest is only for check:bundle; do not publish it
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Playwright E2E (ARCHITECTURE 11.4). Separate and non-blocking on purpose: deploy does not wait for it
  # until it has proven stable on the runners. It builds its own BASE_PATH=/gambling/ bundle into dist-e2e.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 7
