name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm ci fails on Linux: lockfile written on Windows omits rolldown's wasm optional deps (@emnapi/*) — npm bug
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run rtp
      - run: npm run build
        env:
          BASE_PATH: /gambling/
      - run: npm run check:bundle
      - run: npx tsx scripts/i18n-sync.ts --check
      - run: rm -rf dist/.vite   # build manifest is only for check:bundle; do not publish it
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
